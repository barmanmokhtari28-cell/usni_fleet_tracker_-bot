name: USNI Fleet Tracker Monitor

on:
  schedule:
    # Runs at 9:00 AM and 9:00 PM Iran Time (05:30 and 17:30 UTC)
    - cron: '30 5,17 * * *'
  workflow_dispatch: # Allows manual run anytime via the "Run workflow" button

permissions:
  contents: read

concurrency:
  group: usni-fleet-tracker-monitor
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python monitor.py
